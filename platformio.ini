; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; ---------------------------------------------------------------- shared by all boards
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2@^1.6.9
build_flags =
    ${epd.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------- panel options, shared by all boards (incl. STM32)
; 1.54" 152x152 4-color panel (lib/GxEPD2_154c_152); see the main.cpp header for every option
[epd]
build_flags =
    -DEPD_FRAME_RATE=100         ; panel frame rate in Hz: 12 (12.5), 25, 50, 65, 75, 85, 100, 120; 0 = vendor default
    -DEPD_TEMPERATURE=93       ; forced waveform temperature in degC (driver default 93 = fastest band)
    -DEPD_ROTATION=0           ; rotation at boot in 90 degree steps clockwise: 0, 1, 2, -1 (= 270); "rot=N" over serial changes it
    ; -DITEMS_PER_PAGE=4       ; cards per page, 1..4; fewer = taller cards
    ; -DEPD_ABORT_MS=1500      ; cut partial refreshes short
    -DEPD_PAGE_HEIGHT=152     ; rows per drawing page (default 38 on STM32 = 1444 B, whole frame elsewhere)
    ; -DFULL_REFRESH_HOURS=12  ; anti burn-in full refresh interval
    ; -DUPDATE_HOLDOFF_MS=300  ; batch serial updates for this long before a partial refresh
    -DEPD_DEBUG              ; print boot/render progress and driver busy timings on Serial


; ---------------------------------------------------------------- ESP32-C3 SuperMini
[env:esp32c3_supermini]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    ; GPIO19/20 are native USB on the S3, so the C3 pinout can't be reused as-is
    -DEPD_SCK_PIN=10
    -DEPD_MOSI_PIN=7
    -DEPD_CS_PIN=6
    -DEPD_DC_PIN=21
    -DEPD_RST_PIN=20
    -DEPD_BUSY_PIN=5
    ; page button to GND (GPIO9 = BOOT button)
    -DBUTTON_PIN=9
    ; most S3 dev boards only have an addressable RGB LED; set a GPIO here if yours has a plain LED
    -DLED_PIN=-1


; ---------------------------------------------------------------- ESP32-S3 N16R8 (16 MB QIO flash, 8 MB OPI PSRAM)
[env:esp32s3_n16r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    ; GPIO19/20 are native USB on the S3, so the C3 pinout can't be reused as-is
    -DEPD_SCK_PIN=5
    -DEPD_MOSI_PIN=6
    -DEPD_CS_PIN=15
    -DEPD_DC_PIN=16
    -DEPD_RST_PIN=7
    -DEPD_BUSY_PIN=4
    ; page button to GND (GPIO0 = BOOT button)
    -DBUTTON_PIN=0
    ; most S3 dev boards only have an addressable RGB LED; set a GPIO here if yours has a plain LED
    -DLED_PIN=-1

; ---------------------------------------------------------------- STM32F103C8 Blue Pill (20 KB RAM: frame drawn in pages)
[env:stm32f103]
platform = ststm32
board = bluepill_f103c8
upload_protocol = dfu
; many Blue Pills actually have 128 KB flash; uncomment if the build overflows 64 KB
; board_upload.maximum_size = 131072
; adds the include path for avr/pgmspace.h (needed by GxEPD2 on STM32 core 3.x)
extra_scripts = pre:stm32_pgmspace.py
build_flags =
    ${epd.build_flags}
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBD_VID=0xb00b
    -D USBD_PID=0x6969
    ; SCK/MOSI must be SPI1 pins (PA5/PA7); PA6 (MISO) is claimed by SPI1 too.
    ; Keep clear of PA11/PA12 (USB), PA13/PA14 (SWD) and PB2 (BOOT1).
    -DEPD_SCK_PIN=PA5
    -DEPD_MOSI_PIN=PA7
    -DEPD_CS_PIN=PB1
    -DEPD_DC_PIN=PB0
    -DEPD_RST_PIN=PA3
    -DEPD_BUSY_PIN=PB10
    ; page button to GND (internal pull-up)
    -DBUTTON_PIN=PB11
    ; onboard LED, active low
    -DLED_PIN=PC13
